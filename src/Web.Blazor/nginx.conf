server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WASM MIME (obrigatório para Blazor)
    types {
        application/wasm wasm;
    }

    gzip on;
    gzip_types text/plain application/javascript application/json image/svg+xml text/css application/wasm;

    # API via proxy (mesma origem no browser → evita CORS)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets versionados do Blazor — cache longo
    location /_framework/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Entrada SPA — sem cache agressivo (facilita deploy/cutover)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /appsettings.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
