services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ForwardedHeaders__Enabled: "true"
      ConnectionStrings__DefaultConnection: |-
        Server=sqlserver,1433;Database=${SAFETYSCALE_DB_NAME:-SafetyScale};User Id=sa;Password=${MSSQL_SA_PASSWORD:?};Encrypt=True;TrustServerCertificate=True;
      Jwt__Key: ${JWT_KEY:?define JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:?define JWT_ISSUER in .env}
      Jwt__Audience: ${JWT_AUDIENCE:?define JWT_AUDIENCE in .env}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-120}
      Cors__OriginsCsv: ${CORS_ORIGINS:-}
      PublicUrls__WebBaseUrl: ${PUBLIC_WEB_BASE_URL:-http://localhost}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Smtp__FromDisplayName: ${SMTP_FROM_DISPLAY_NAME:-SafetyScale}
      Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      EmailQueue__Enabled: ${EMAIL_QUEUE_ENABLED:-true}
      EmailQueue__PollIntervalSeconds: ${EMAIL_QUEUE_POLL_INTERVAL_SECONDS:-5}
      EmailQueue__BatchSize: ${EMAIL_QUEUE_BATCH_SIZE:-10}
      EmailQueue__MaxAttempts: ${EMAIL_QUEUE_MAX_ATTEMPTS:-5}
      EmailQueue__InitialRetryDelaySeconds: ${EMAIL_QUEUE_INITIAL_RETRY_DELAY_SECONDS:-30}
      EmailQueue__MaxRetryDelaySeconds: ${EMAIL_QUEUE_MAX_RETRY_DELAY_SECONDS:-3600}
      EmailQueue__StaleProcessingMinutes: ${EMAIL_QUEUE_STALE_PROCESSING_MINUTES:-10}
      BootstrapUser__Email: ${BOOTSTRAP_USER_EMAIL:-}
      BootstrapUser__Password: ${BOOTSTRAP_USER_PASSWORD:-}
      BootstrapUser__DisplayName: ${BOOTSTRAP_USER_DISPLAY_NAME:-Platform Admin}
      BootstrapUser__Role: ${BOOTSTRAP_USER_ROLE:-PlatformOwner}
    ports:
      - "${API_PORT:-8081}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/Web.Blazor/Dockerfile
      args:
        # Vazio = same-origin /api via Nginx. Preencher só em split-origin (+ CORS_ORIGINS na API).
        API_BASE_URL: ${API_BASE_URL:-}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  sqlserver-data:

networks:
  default:
    name: safetyscale-prod-net
