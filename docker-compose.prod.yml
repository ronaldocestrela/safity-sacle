services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ForwardedHeaders__Enabled: "true"
      ConnectionStrings__DefaultConnection: |-
        Server=sqlserver,1433;Database=${SAFETYSCALE_DB_NAME:-SafetyScale};User Id=sa;Password=${MSSQL_SA_PASSWORD:?};Encrypt=True;TrustServerCertificate=True;
      Jwt__Key: ${JWT_KEY:?define JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:?define JWT_ISSUER in .env}
      Jwt__Audience: ${JWT_AUDIENCE:?define JWT_AUDIENCE in .env}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-120}
      Cors__OriginsCsv: ${CORS_ORIGINS:-}
    ports:
      - "${API_PORT:-8081}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: ./src/Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  sqlserver-data:

networks:
  default:
    name: safetyscale-prod-net
